    <title>IniCode</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; background: #0f172a; }
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0f172a;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }
      #app-loader.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .loader-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(249, 115, 22, 0.2);
        border-top-color: #f97316;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 24px;
      }
      .loader-text {
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      .loader-subtext {
        font-size: 0.875rem;
        color: #94a3b8;
        margin-top: 8px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="app-loader" aria-live="polite" aria-busy="true">
      <div class="loader-spinner"></div>
      <div class="loader-text">IniCode</div>
      <div class="loader-subtext">Chargement en cours...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
